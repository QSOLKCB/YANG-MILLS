[package]
name = "yang-mills-reference"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/QSOLKCB/YANG-MILLS"
description = "Deterministic SU(2) Wilson-lattice reference core and invariant observables for YANG-MILLS Phase 1A"
default-run = "ym-su2-reference"

[lib]
path = "reference/rust/src/lib.rs"

[[bin]]
name = "ym-su2-reference"
path = "reference/rust/src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
