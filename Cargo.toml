[package]
name = "yang-mills-reference"
version = "0.11.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/QSOLKCB/YANG-MILLS"
description = "Deterministic and stochastic SU(2)/SU(3) lattice, holonomy, classical-geometry, ensemble, published-baseline, glueball-operator, spatial-smearing, and spatial-blocking reference surfaces for YANG-MILLS"
default-run = "ym-su2-reference"

[lib]
path = "reference/rust/src/lib.rs"

[[bin]]
name = "ym-su2-reference"
path = "reference/rust/src/main.rs"

[[bin]]
name = "ym-su3-algebra"
path = "reference/rust/src/bin/su3_reference.rs"

[[bin]]
name = "ym-su3-lattice"
path = "reference/rust/src/bin/su3_lattice_reference.rs"

[[bin]]
name = "ym-su3-center"
path = "reference/rust/src/bin/su3_center_reference.rs"

[[bin]]
name = "ym-path-holonomy"
path = "reference/rust/src/bin/path_holonomy_reference.rs"

[[bin]]
name = "ym-classical-geometry"
path = "reference/rust/src/bin/classical_geometry_reference.rs"

[[bin]]
name = "ym-su2-ensemble"
path = "reference/rust/src/bin/su2_ensemble_reference.rs"

[[bin]]
name = "ym-su2-plaquette-baseline"
path = "reference/rust/src/bin/su2_benchmark_reference.rs"

[[bin]]
name = "ym-su3-ensemble"
path = "reference/rust/src/bin/su3_ensemble_reference.rs"

[[bin]]
name = "ym-su3-plaquette-baseline"
path = "reference/rust/src/bin/su3_benchmark_reference.rs"

[[bin]]
name = "ym-su3-plaquette-baseline-v2"
path = "reference/rust/src/bin/su3_confirmation_reference.rs"

[[bin]]
name = "ym-glueball-operators"
path = "reference/rust/src/bin/glueball_operators_reference.rs"

[[bin]]
name = "ym-glueball-smearing"
path = "reference/rust/src/bin/glueball_smearing_reference.rs"

[[bin]]
name = "ym-glueball-blocking"
path = "reference/rust/src/bin/glueball_blocking_reference.rs"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
