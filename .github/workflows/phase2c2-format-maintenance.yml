name: Phase 2C2 V2 format maintenance

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'phase2c2-su3-published-baseline'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Rust toolchain
        run: rustup show

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference/rust/src/bin/su3_benchmark_reference.rs reference/rust/src/bin/su3_confirmation_reference.rs reference/rust/src/su3_confirmation.rs
          git commit -m 'Format Phase 2C2 V2 Rust sources'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
