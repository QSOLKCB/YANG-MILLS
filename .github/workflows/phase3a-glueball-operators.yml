name: Phase 3A glueball operators

on:
  pull_request:

permissions:
  contents: write

jobs:
  glueball-operators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Rust toolchain
        run: rustup show

      - name: Apply PR #11 review hardening
        run: |
          python3 scripts/apply_pr11_review_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md ROADMAP.md contracts/YM-GLUEBALL-OPERATORS-V1.json docs/GLUEBALL_OPERATORS.md reference/rust/src/glueball_operators.rs scripts/check_glueball_operator_contracts.py scripts/test_glueball_operator_contract_validation.py test-vectors/glueball-operators-phase3a-v1.json
          git diff --cached --check
          git commit -m "Harden Phase 3A review surfaces"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Strict Rust format
        run: cargo fmt --all -- --check

      - name: Phase 3A unit tests
        run: cargo test --locked --bin ym-glueball-operators

      - name: Phase 3A deterministic reference vectors
        run: cargo run --quiet --locked --bin ym-glueball-operators

      - name: Phase 3A contract checks
        run: python3 scripts/check_glueball_operator_contracts.py

      - name: Phase 3A negative contract regressions
        run: python3 scripts/test_glueball_operator_contract_validation.py
