name: Phase 2C2 published SU(3) benchmark

on:
  pull_request:

permissions:
  contents: write

jobs:
  published-su3-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Rust toolchain
        run: rustup show

      - name: Apply fifth review hardening
        if: github.event.pull_request.head.ref == 'phase2c2-su3-published-baseline'
        run: |
          python3 scripts/run_pr10_review_fixes_round5.py
          cargo fmt --all
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              contracts/YM-SU3-PLAQUETTE-BASELINE-V1.json \
              contracts/YM-SU3-PLAQUETTE-BASELINE-V2.json \
              test-vectors/su3-plaquette-baseline-v1.json \
              test-vectors/su3-plaquette-baseline-v2.json \
              scripts/check_su3_baseline_contracts.py \
              scripts/test_su3_baseline_contract_validation.py \
              reference/rust/src/su3_benchmark.rs \
              reference/rust/src/bin/su3_benchmark_reference.rs \
              reference/rust/src/bin/su3_confirmation_reference.rs
            git commit -m 'Address fifth PR 10 review hardening pass'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Strict Rust format
        run: cargo fmt --all -- --check

      - name: Phase 2C2 V1 archive unit tests
        run: cargo test --locked --bin ym-su3-plaquette-baseline

      - name: Phase 2C2 V2 confirmation unit tests
        run: cargo test --locked --bin ym-su3-plaquette-baseline-v2

      - name: Reproduce archived Phase 2C2 V1 failure boundary
        run: cargo run --release --quiet --locked --bin ym-su3-plaquette-baseline

      - name: Run fresh Phase 2C2 V2 four-chain confirmation
        run: cargo run --release --quiet --locked --bin ym-su3-plaquette-baseline-v2

      - name: Phase 2C2 contract checks
        run: python3 scripts/check_su3_baseline_contracts.py

      - name: Phase 2C2 negative contract regressions
        run: python3 scripts/test_su3_baseline_contract_validation.py
