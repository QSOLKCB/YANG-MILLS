name: Phase 2C2 published SU(3) benchmark

on:
  pull_request:

permissions:
  contents: write

jobs:
  published-su3-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Rust toolchain
        run: rustup show

      - name: Apply closed typed schema hardening
        run: |
          python3 scripts/apply_pr10_closed_typed_schema.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_su3_baseline_contracts.py scripts/test_su3_baseline_contract_validation.py
          git diff --cached --check
          git commit -m "Validate SU3 baseline contracts as closed typed schemas"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Strict Rust format
        run: cargo fmt --all -- --check

      - name: Phase 2C2 V1 archive unit tests
        run: cargo test --locked --bin ym-su3-plaquette-baseline

      - name: Phase 2C2 V2 confirmation unit tests
        run: cargo test --locked --bin ym-su3-plaquette-baseline-v2

      - name: Reproduce archived Phase 2C2 V1 failure boundary
        run: cargo run --release --quiet --locked --bin ym-su3-plaquette-baseline

      - name: Run fresh Phase 2C2 V2 four-chain confirmation
        run: cargo run --release --quiet --locked --bin ym-su3-plaquette-baseline-v2

      - name: Phase 2C2 contract checks
        run: python3 scripts/check_su3_baseline_contracts.py

      - name: Phase 2C2 negative contract regressions
        run: python3 scripts/test_su3_baseline_contract_validation.py
