name: Phase 3B1 spatial stout smearing

on:
  pull_request:

permissions:
  contents: write

jobs:
  spatial-stout-smearing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Rust toolchain
        run: rustup show

      - name: Apply PR #12 review hardening
        run: |
          python3 scripts/apply_pr12_review_hardening.py
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/rust/src/glueball_smearing.rs reference/rust/src/bin/glueball_smearing_reference.rs contracts/YM-GLUEBALL-SPATIAL-STOUT-V1.json test-vectors/glueball-spatial-stout-phase3b1-v1.json scripts/check_glueball_smearing_contracts.py scripts/test_glueball_smearing_contract_validation.py docs/GLUEBALL_SMEARING.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Harden Phase 3B1 review surfaces"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Strict Rust format
        run: cargo fmt --all -- --check

      - name: Phase 3B1 unit tests
        run: cargo test --locked --bin ym-glueball-smearing

      - name: Phase 3B1 deterministic reference vectors
        run: cargo run --quiet --locked --bin ym-glueball-smearing

      - name: Phase 3B1 contract checks
        run: python3 scripts/check_glueball_smearing_contracts.py

      - name: Phase 3B1 negative contract regressions
        run: python3 scripts/test_glueball_smearing_contract_validation.py
