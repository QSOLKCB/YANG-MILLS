name: Phase 3B1 spatial stout smearing

on:
  pull_request:

permissions:
  contents: write

jobs:
  spatial-stout-smearing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Rust toolchain
        run: rustup show

      - name: Apply PR #12 status/readiness synchronization
        run: |
          python3 scripts/apply_pr12_status_surfaces.py
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md AGENTS.md reference/rust/src/glueball_smearing.rs reference/rust/src/bin/glueball_smearing_reference.rs
          git diff --cached --check
          git commit -m "Synchronize Phase 3B1 status and formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Strict Rust format
        run: cargo fmt --all -- --check

      - name: Phase 3B1 unit tests
        run: cargo test --locked --bin ym-glueball-smearing

      - name: Phase 3B1 deterministic reference vectors
        run: cargo run --quiet --locked --bin ym-glueball-smearing

      - name: Phase 3B1 contract checks
        run: python3 scripts/check_glueball_smearing_contracts.py

      - name: Phase 3B1 negative contract regressions
        run: python3 scripts/test_glueball_smearing_contract_validation.py
