name: Phase 3B2 spatial blocking

on:
  pull_request:

permissions:
  contents: write

jobs:
  spatial-blocking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Rust toolchain
        run: rustup show

      - name: Apply PR #13 status/readiness synchronization
        run: |
          python3 scripts/apply_pr13_status_surfaces.py
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md AGENTS.md reference/rust/src/glueball_blocking.rs reference/rust/src/bin/glueball_blocking_reference.rs reference/rust/src/bin/glueball_smearing_reference.rs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize Phase 3B2 status and formatting"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Strict Rust format
        run: cargo fmt --all -- --check

      - name: Phase 3B2 unit tests
        run: cargo test --locked --bin ym-glueball-blocking

      - name: Phase 3B2 deterministic reference vectors
        run: cargo run --quiet --locked --bin ym-glueball-blocking

      - name: Phase 3B2 contract checks
        run: python3 scripts/check_glueball_blocking_contracts.py

      - name: Phase 3B2 negative contract regressions
        run: python3 scripts/test_glueball_blocking_contract_validation.py
