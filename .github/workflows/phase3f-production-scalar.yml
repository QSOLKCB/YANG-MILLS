name: Phase 3F production scalar stability

on:
  pull_request:

permissions:
  contents: read

jobs:
  production-scalar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show

      - name: Strict Rust format
        run: cargo fmt --all -- --check

      - name: Phase 3F unit tests
        run: cargo test --locked --bin ym-glueball-scalar-production

      - name: Phase 3F contract checks
        run: python3 scripts/check_glueball_scalar_production_contracts.py

      - name: Phase 3F negative contract regressions
        run: python3 scripts/test_glueball_scalar_production_contract_validation.py

      - name: Phase 3F production scalar evidence
        run: cargo run --release --quiet --locked --bin ym-glueball-scalar-production
