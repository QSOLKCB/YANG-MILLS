name: Phase 3D effective mass

on:
  pull_request:

permissions:
  contents: read

jobs:
  effective-mass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show

      - name: Strict Rust format
        run: cargo fmt --all -- --check

      - name: Phase 3D unit tests
        run: cargo test --locked --bin ym-glueball-effective-mass

      - name: Phase 3D deterministic reference vectors
        run: cargo run --quiet --locked --bin ym-glueball-effective-mass

      - name: Phase 3D contract checks
        run: python3 scripts/check_glueball_effective_mass_contracts.py

      - name: Phase 3D negative contract regressions
        run: python3 scripts/test_glueball_effective_mass_contract_validation.py
