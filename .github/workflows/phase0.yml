name: YANG-MILLS reference checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --all-targets --locked

      - name: SU(2) reference vectors
        run: cargo run --quiet --locked --bin ym-su2-reference

      - name: SU(3) algebra reference vectors
        run: cargo run --quiet --locked --bin ym-su3-algebra

      - name: SU(3) lattice reference vectors
        run: cargo run --quiet --locked --bin ym-su3-lattice

      - name: SU(3) center reference vectors
        run: cargo run --quiet --locked --bin ym-su3-center

      - name: Path holonomy reference vectors
        run: cargo run --quiet --locked --bin ym-path-holonomy

      - name: Classical geometry reference vectors
        run: cargo run --quiet --locked --bin ym-classical-geometry

      - name: SU(2) ensemble reference vectors
        run: cargo run --quiet --locked --bin ym-su2-ensemble

      - name: Published SU(2) plaquette baseline
        run: cargo run --quiet --locked --bin ym-su2-plaquette-baseline

      - name: SU(3) ensemble reference vectors
        run: cargo run --quiet --locked --bin ym-su3-ensemble

      - name: Reproduce archived Phase 2C2 V1 failure boundary
        run: cargo run --release --quiet --locked --bin ym-su3-plaquette-baseline

      - name: Fresh Phase 2C2 V2 four-chain confirmation
        run: cargo run --release --quiet --locked --bin ym-su3-plaquette-baseline-v2

      - name: Phase 3A glueball operator reference vectors
        run: cargo run --quiet --locked --bin ym-glueball-operators

      - name: Phase 3B1 spatial stout-smearing reference vectors
        run: cargo run --quiet --locked --bin ym-glueball-smearing

      - name: Phase 3B2 spatial blocking reference vectors
        run: cargo run --quiet --locked --bin ym-glueball-blocking

      - name: All contract checks
        run: python3 scripts/check_all_contracts.py

      - name: All negative contract regressions
        run: python3 scripts/test_all_contract_validation.py
