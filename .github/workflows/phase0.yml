name: Phase 0 reference checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --all-targets --locked

      - name: Reference vectors
        run: cargo run --quiet --locked --bin ym-su2-reference

      - name: Contract checks
        run: python3 scripts/check_contracts.py
