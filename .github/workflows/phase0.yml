name: YANG-MILLS reference checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --all-targets --locked

      - name: SU(2) reference vectors
        run: cargo run --quiet --locked --bin ym-su2-reference

      - name: SU(3) algebra reference vectors
        run: cargo run --quiet --locked --bin ym-su3-algebra

      - name: Core contract checks
        run: python3 scripts/check_contracts.py

      - name: Core negative contract regressions
        run: python3 scripts/test_contract_validation.py

      - name: SU(3) contract checks
        run: python3 scripts/check_su3_contracts.py

      - name: SU(3) negative contract regressions
        run: python3 scripts/test_su3_contract_validation.py
