name: YANG-MILLS reference checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --all-targets --locked

      - name: SU(2) reference vectors
        run: cargo run --quiet --locked --bin ym-su2-reference

      - name: SU(3) algebra reference vectors
        run: cargo run --quiet --locked --bin ym-su3-algebra

      - name: SU(3) lattice reference vectors
        run: cargo run --quiet --locked --bin ym-su3-lattice

      - name: SU(3) center reference vectors
        run: cargo run --quiet --locked --bin ym-su3-center

      - name: Path holonomy reference vectors
        run: cargo run --quiet --locked --bin ym-path-holonomy

      - name: Classical geometry reference vectors
        run: cargo run --quiet --locked --bin ym-classical-geometry

      - name: All contract checks
        run: python3 scripts/check_all_contracts.py

      - name: All negative contract regressions
        run: python3 scripts/test_all_contract_validation.py
