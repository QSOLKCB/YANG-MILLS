name: Phase 3I scalar temporal-extent recovery

on:
  pull_request:

permissions:
  contents: read

jobs:
  scalar-temporal-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show

      - name: Strict Rust format
        run: cargo fmt --all -- --check

      - name: Phase 3I unit tests
        run: cargo test --locked --bin ym-glueball-scalar-temporal-recovery

      - name: Phase 3I contract checks
        run: python3 scripts/check_glueball_scalar_temporal_recovery_contracts.py

      - name: Phase 3I negative contract regressions
        run: python3 scripts/test_glueball_scalar_temporal_recovery_contract_validation.py

      - name: Frozen Phase 3H receipt replay
        run: cargo run --release --quiet --locked --bin ym-glueball-scalar-geometry-recovery

      - name: Phase 3I temporal-extent recovery evidence
        run: cargo run --release --quiet --locked --bin ym-glueball-scalar-temporal-recovery
